<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сигма · Личный кабинет</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Unbounded:wght@700;800&display=swap');
    :root{
      --green:#91B94A;--black:#2B2A29;--purple:#4E3479;--white:#FFFFFF;
      --gray:#E5E6E6;--yellow:#EADB4C;--orange:#D97A38;--red:#752E27;
      --blue:#314388;--bg:#F7F7F5;--muted:#6E6E6E;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;background:var(--bg);color:var(--black);font-family:'Montserrat',Arial,sans-serif}
    button,input{font:inherit} button{cursor:pointer} [hidden]{display:none!important}
    .page{width:min(1160px,calc(100% - 28px));margin:0 auto;padding:24px 0 56px}
    .brand{font-family:'Unbounded',sans-serif;font-weight:800;font-size:22px;color:var(--purple);margin-bottom:18px;letter-spacing:-.02em}
    .login-wrap{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:30px 0 80px}
    .login-card{width:min(560px,100%);padding:34px;background:var(--white);border:1px solid var(--gray);border-radius:22px}
    .login-title{margin:0;font-family:'Unbounded',sans-serif;font-size:clamp(30px,5vw,42px);font-weight:800;line-height:1.08;letter-spacing:-.035em}
    .login-text{margin:14px 0 24px;color:var(--muted);font-size:15px;line-height:1.55}
    .code-label{display:block;margin-bottom:8px;font-size:14px;font-weight:700}
    .code-input{width:100%;height:58px;padding:0 16px;color:var(--black);background:var(--white);border:1.5px solid var(--gray);border-radius:14px;outline:none;font-size:22px;font-weight:700;letter-spacing:.08em}
    .code-input:focus{border-color:var(--purple)}
    .login-button{width:100%;min-height:54px;margin-top:12px;padding:12px 18px;background:var(--purple);color:var(--white);border:0;border-radius:14px;font-weight:800}
    .login-button:disabled{opacity:.55;cursor:default}
    .login-error{min-height:22px;margin-top:14px;color:var(--red);font-size:14px;font-weight:600;line-height:1.45}
    .hero{background:var(--purple);color:var(--white);border-radius:22px;padding:28px 30px 24px}
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
    .student-name{margin:0;font-family:'Unbounded',sans-serif;font-size:clamp(38px,5vw,54px);font-weight:800;line-height:1.02;letter-spacing:-.04em}
    .logout{border:1px solid var(--white);color:var(--white);background:transparent;border-radius:10px;padding:9px 14px;font-weight:600}
    .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
    .stat{min-width:145px;padding:13px 16px;border-radius:14px;color:var(--black)}
    .stat.sigmuses{background:var(--green)} .stat.xp{background:var(--yellow)} .stat.rank{background:var(--orange)}
    .stat-label{display:block;opacity:.7;margin-bottom:3px;font-size:13px}.stat-value{font-size:22px;font-weight:800}
    .content{background:var(--white);border:1px solid var(--gray);border-radius:22px;padding:28px;margin-top:18px}
    .section{margin-top:34px}.section:first-child{margin-top:0}
    .section-title{margin:0;font-family:'Unbounded',sans-serif;font-size:24px;font-weight:800;line-height:1.14;letter-spacing:-.02em}
    .section-meta{margin-top:4px;color:var(--muted);font-weight:600;font-size:15px}
    .section-line{width:62px;height:5px;border-radius:999px;margin:10px 0 14px}
    .olympiad .section-line{background:var(--purple)} .advanced .section-line{background:var(--green)} .ag .section-line{background:var(--blue)} .practicums .section-line{background:var(--orange)}
    .cards{display:grid;gap:10px}.card{min-height:94px;padding:15px;border:1px solid var(--gray);border-radius:14px;background:var(--white);text-align:left}.card.ready{border-width:2px}
    .olympiad .card.ready{border-color:var(--purple)} .advanced .card.ready{border-color:var(--green)} .ag .card.ready{border-color:var(--blue)} .practicums .card.ready{border-color:var(--orange)}
    .card-title{font-size:16px;font-weight:800;margin-bottom:6px}.card-status{font-size:13px;color:#777;line-height:1.35}.card.ready .card-status{font-weight:700}
    .olympiad .card.ready .card-status{color:var(--purple)} .advanced .card.ready .card-status{color:var(--green)} .ag .card.ready .card-status{color:var(--blue)} .practicums .card.ready .card-status{color:var(--orange)}
    dialog{border:0;border-radius:18px;width:min(660px,calc(100% - 28px));padding:0;box-shadow:0 20px 60px rgba(0,0,0,.18)} dialog::backdrop{background:rgba(43,42,41,.26)}
    .modal{padding:24px;background:var(--white)}.modal-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.modal-title{margin:0;font-family:'Unbounded',sans-serif;font-size:22px}.close{width:34px;height:34px;border:0;border-radius:50%;background:var(--gray);font-size:20px}.modal-content{white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}.modal-content a{color:var(--purple);font-weight:600}
    @media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
    @media(max-width:620px){.page{width:calc(100% - 16px);padding-top:16px}.brand{font-size:18px}.login-card{padding:24px 20px}.hero{padding:22px 20px}.hero-top{flex-direction:column}.student-name{font-size:36px}.content{padding:20px}.cards{grid-template-columns:1fr!important}.stat{min-width:0;flex:1 1 30%}}
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">Сигма · Личный кабинет</div>

    <section id="loginScreen" class="login-wrap">
      <div class="login-card">
        <h1 class="login-title">Войти в личный кабинет</h1>
        <p class="login-text">Введите ваш 8-значный код доступа.</p>
        <form id="loginForm" autocomplete="off">
          <label class="code-label" for="accessCode">Код доступа</label>
          <input id="accessCode" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" placeholder="00000000" required>
          <button id="loginButton" class="login-button" type="submit">Войти</button>
          <div id="loginError" class="login-error" aria-live="polite"></div>
        </form>
      </div>
    </section>

    <section id="cabinetScreen" hidden>
      <section class="hero">
        <div class="hero-top">
          <h1 id="studentName" class="student-name"></h1>
          <button id="logoutButton" class="logout" type="button">Выйти</button>
        </div>
        <div id="stats" class="stats"></div>
      </section>
      <section id="content" class="content"></section>
    </section>
  </main>

  <dialog id="dialog">
    <div class="modal">
      <div class="modal-head">
        <h2 id="dialogTitle" class="modal-title"></h2>
        <button id="closeDialog" class="close" type="button" aria-label="Закрыть">×</button>
      </div>
      <div id="dialogContent" class="modal-content"></div>
    </div>
  </dialog>

  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbz5jhbsj2t8mRr237NJals3BB7YGt2MbJgCRKZLDwxpRp2yH6NpDBSpRGqR2sX71r-X/exec';
    const POLL_CALLBACK='sigmaPollCallback';

    const loginScreen=document.getElementById('loginScreen');
    const cabinetScreen=document.getElementById('cabinetScreen');
    const loginForm=document.getElementById('loginForm');
    const accessCodeInput=document.getElementById('accessCode');
    const loginButton=document.getElementById('loginButton');
    const loginError=document.getElementById('loginError');
    const studentName=document.getElementById('studentName');
    const stats=document.getElementById('stats');
    const content=document.getElementById('content');
    const logoutButton=document.getElementById('logoutButton');
    const dialog=document.getElementById('dialog');
    const dialogTitle=document.getElementById('dialogTitle');
    const dialogContent=document.getElementById('dialogContent');
    const closeDialog=document.getElementById('closeDialog');
    let loginInProgress=false;

    function getClientId(){
      let id=localStorage.getItem('sigma_lk_client_id');
      if(id)return id;
      id=(window.crypto&&typeof crypto.randomUUID==='function')?crypto.randomUUID():'client-'+Date.now()+'-'+Math.random().toString(36).slice(2);
      localStorage.setItem('sigma_lk_client_id',id);
      return id;
    }

    function createRequestId(){
      let base=(window.crypto&&typeof crypto.randomUUID==='function')?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
      return 'req_'+base.replace(/[^A-Za-z0-9_-]/g,'');
    }

    loginForm.addEventListener('submit',async event=>{
      event.preventDefault();
      loginError.textContent='';
      const code=accessCodeInput.value.replace(/\D/g,'');
      if(code.length!==8){loginError.textContent='Введите 8-значный код.';return;}
      if(loginInProgress)return;
      loginInProgress=true;setLoading(true);
      try{
        const requestId=createRequestId();
        const postPromise=submitLoginPost(requestId,code,getClientId());
        postPromise.catch(error=>console.error(error));
        const result=await waitForLoginResult(requestId);
        if(!result||result.ok!==true){loginError.textContent=result&&result.message?result.message:'Не удалось войти. Попробуйте ещё раз.';return;}
        if(!result.cabinet){loginError.textContent='Не удалось загрузить данные кабинета.';return;}
        renderCabinet(result.cabinet);showCabinet();
      }catch(error){console.error(error);loginError.textContent='Не удалось связаться с сервером. Попробуйте немного позже.';}
      finally{loginInProgress=false;setLoading(false);}
    });

    async function submitLoginPost(requestId,accessCode,clientId){
      const body=new URLSearchParams();
      body.set('action','login');body.set('requestId',requestId);body.set('accessCode',accessCode);body.set('clientId',clientId);
      await fetch(API_URL,{method:'POST',mode:'no-cors',cache:'no-store',body});
    }

    function waitForLoginResult(requestId){
      return new Promise((resolve,reject)=>{
        const startedAt=Date.now();let timer=null;let script=null;let callbackReceived=false;let settled=false;
        const callbackName=POLL_CALLBACK+'_'+requestId.replace(/[^A-Za-z0-9_$]/g,'_');
        const cleanup=()=>{if(timer)clearTimeout(timer);if(script&&script.parentNode)script.parentNode.removeChild(script);try{delete window[callbackName]}catch(e){window[callbackName]=undefined}};
        const fail=message=>{if(settled)return;settled=true;cleanup();reject(new Error(message))};
        const done=result=>{if(settled)return;settled=true;cleanup();resolve(result)};
        const next=(delay=500)=>{if(!settled)timer=setTimeout(poll,delay)};

        window[callbackName]=payload=>{
          callbackReceived=true;
          if(script&&script.parentNode)script.parentNode.removeChild(script);script=null;
          if(settled)return;
          if(!payload){next();return;}
          if(payload.pending===true){if(Date.now()-startedAt>30000){fail('Истекло время ожидания ответа.');return;}next(500);return;}
          if(payload.pending===false){done(payload.result);return;}
          next();
        };

        function poll(){
          if(settled)return;
          if(Date.now()-startedAt>30000){fail('Истекло время ожидания ответа.');return;}
          callbackReceived=false;
          const url=new URL(API_URL);url.searchParams.set('action','poll');url.searchParams.set('requestId',requestId);url.searchParams.set('callback',callbackName);url.searchParams.set('_',String(Date.now()));
          script=document.createElement('script');script.async=true;script.src=url.toString();
          script.onerror=()=>{if(script&&script.parentNode)script.parentNode.removeChild(script);script=null;next(700)};
          script.onload=()=>{if(!callbackReceived&&!settled){if(script&&script.parentNode)script.parentNode.removeChild(script);script=null;next(700)}};
          document.head.appendChild(script);
        }
        next(250);
      });
    }

    function renderCabinet(cabinet){
      studentName.textContent=cabinet.name||'';renderStats(cabinet);content.replaceChildren();
      const programs=Array.isArray(cabinet.programs)?cabinet.programs:[];programs.forEach(p=>content.appendChild(createProgramSection(p)));
      const practicums=Array.isArray(cabinet.mathPracticums)?cabinet.mathPracticums:[];if(practicums.length)content.appendChild(createPracticumsSection(practicums));
    }

    function renderStats(cabinet){
      stats.replaceChildren();
      if(hasValue(cabinet.sigmuses))stats.appendChild(createStat('Сигмусы',cabinet.sigmuses,'sigmuses'));
      if(hasValue(cabinet.xp))stats.appendChild(createStat('XP',cabinet.xp,'xp'));
      if(hasValue(cabinet.rank))stats.appendChild(createStat('Ранг',cabinet.rank,'rank'));
    }
    function hasValue(v){return !(v===''||v===null||v===undefined)}
    function createStat(label,value,cls){const b=document.createElement('div');b.className='stat '+cls;const l=document.createElement('span');l.className='stat-label';l.textContent=label;const v=document.createElement('div');v.className='stat-value';v.textContent=String(value);b.append(l,v);return b}

    function createProgramSection(program){
      const s=document.createElement('section');const type=program.type||'';s.className='section '+(type==='olympiad'?'olympiad':type==='um'?'advanced':type==='ag'?'ag':'');
      const t=document.createElement('h2');t.className='section-title';t.textContent=program.label||'Программа';s.appendChild(t);
      let meta='';if(type==='olympiad')meta=program.stage||'';else if(hasValue(program.classNumber))meta=program.classNumber+' класс';if(meta){const m=document.createElement('div');m.className='section-meta';m.textContent=meta;s.appendChild(m)}
      const line=document.createElement('div');line.className='section-line';s.appendChild(line);
      const cards=document.createElement('div');cards.className='cards';const assessments=Array.isArray(program.assessments)?program.assessments:[];const hasFinal=!!program.finalAssessment;applyGridColumns(cards,assessments.length+(hasFinal?1:0));
      assessments.forEach(a=>cards.appendChild(createResultCard('Зачёт '+(a.number||''),a.status,a.text)));
      if(hasFinal)cards.appendChild(createResultCard('Итоговый срез',program.finalAssessment.status,program.finalAssessment.text));s.appendChild(cards);return s;
    }

    function createPracticumsSection(practicums){
      const s=document.createElement('section');s.className='section practicums';const t=document.createElement('h2');t.className='section-title';t.textContent='Математические практикумы';const line=document.createElement('div');line.className='section-line';const cards=document.createElement('div');cards.className='cards';applyGridColumns(cards,practicums.length);practicums.forEach(p=>cards.appendChild(createResultCard('Практикум '+(p.number||''),'ready',p.text||'')));s.append(t,line,cards);return s;
    }

    function applyGridColumns(container,count){let n=1;if(count>=5)n=5;else if(count===4)n=4;else if(count===3)n=3;else if(count===2)n=2;container.style.gridTemplateColumns='repeat('+n+', minmax(0,1fr))'}

    function createResultCard(title,status,text){
      const c=document.createElement('button');c.type='button';c.className='card';const ready=hasResult(status,text);if(ready)c.classList.add('ready');const t=document.createElement('div');t.className='card-title';t.textContent=title;const st=document.createElement('div');st.className='card-status';st.textContent=ready?'Результат готов':'Ещё не проходил';c.append(t,st);c.addEventListener('click',()=>openResultDialog(title,text||'Зачёт ещё не проходил.'));return c;
    }

    function hasResult(status,text){const s=String(status||'').trim().toLowerCase();if(['ready','done','completed','result'].includes(s))return true;const t=String(text||'').trim().toLowerCase();if(!t)return false;if(t.includes('ещё не проходил')||t.includes('еще не проходил'))return false;return true}

    function openResultDialog(title,text){dialogTitle.textContent=title;renderTextWithLinks(dialogContent,text);dialog.showModal()}
    function renderTextWithLinks(container,text){container.replaceChildren();String(text||'').split(/(https?:\/\/[^\s]+)/g).forEach(part=>{if(/^https?:\/\//i.test(part)){const a=document.createElement('a');a.href=part;a.target='_blank';a.rel='noopener noreferrer';a.textContent=part;container.appendChild(a)}else container.appendChild(document.createTextNode(part))})}
    closeDialog.addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
    logoutButton.addEventListener('click',()=>{showLogin();accessCodeInput.value='';loginError.textContent='';studentName.textContent='';stats.replaceChildren();content.replaceChildren();accessCodeInput.focus()});
    function showCabinet(){loginScreen.hidden=true;cabinetScreen.hidden=false;window.scrollTo(0,0)}
    function showLogin(){cabinetScreen.hidden=true;loginScreen.hidden=false;window.scrollTo(0,0)}
    function setLoading(v){loginButton.disabled=v;accessCodeInput.disabled=v;loginButton.textContent=v?'Входим…':'Войти'}
    accessCodeInput.addEventListener('input',()=>{accessCodeInput.value=accessCodeInput.value.replace(/\D/g,'').slice(0,8);loginError.textContent=''})
  </script>
</body>
</html>
